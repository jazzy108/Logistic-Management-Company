<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistic Management Company</title>
    <link rel="stylesheet" href="sign.css">
</head>
<body background="background.jfif">
     <div class="card">
    <div class="logo">
      <img src="logo (2).png" alt="my logo">
      <div >
        <div class="logo-text">JAZZY</div>
        <div class="logo-sub">Freight Forwarding Service</div>
      </div>
    </div>

    <form>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="jazz Logistic" required>
      </div>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="jazzylogistic@gmail.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" placeholder="••••••••" required>
      </div>

      <div class="options">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="btn">SIGN UP</button>
    </form>

    <div class="footer-text">
      Already have an account? <a href="index.html">Log In</a>
    </div>
  </div>
</body>
</html>
