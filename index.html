<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistic Management Company</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body background="background.jfif">
<div class="login-container">

    <div class="logo">
        <img src="logo (2).png" alt="my logo">
        <h1>JAZZY</h1>
        <p>Freight Forwarding Service</p>
    </div>

    <form>
        <div class="form-group">
            <label>Username</label>
            <input type="email" placeholder="jazzylogistic@gmail.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="••••••">
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> Remember me
            </label>

            <a href="forget.html">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">
            LOGIN
        </button>

        <div class="signup">
            Don't have an account?
            <a href="Reg.html">Sign Up</a>
        </div>
    </form>

</div>
</body>
</html>
